name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init "Doremon AI" com.doremon.ai --web-dir=dist
      - run: rm -f capacitor.config.ts && printf '{"appId":"com.doremon.ai","appName":"Doremon AI","webDir":"dist"}' > capacitor.config.json
      - run: npx cap add android
      - run: npx cap copy android && npx cap sync
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: printf "\nallprojects { configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.9.24' } } } }\n" >> android/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DOREMON-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
